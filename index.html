  <script>
    (function () {
      var langMap = {
        en: "en", "en-us": "en", "en-gb": "en", "en-au": "en", "en-ca": "en", "en-nz": "en", "en-za": "en", "en-ie": "en", "en-in": "en",

        fr: "fr", "fr-fr": "fr", "fr-ca": "fr", "fr-be": "fr", "fr-ch": "fr",
        pt: "pt", "pt-pt": "pt",
        "pt-br": "pt-br",
        de: "de", "de-de": "de", "de-at": "de", "de-ch": "de",
        it: "it", "it-it": "it",
        ja: "ja", "ja-jp": "ja",
        ko: "ko", "ko-kr": "ko",
        zh: "zh", "zh-cn": "zh", "zh-sg": "zh",
        "zh-tw": "zh-tw", "zh-hk": "zh-tw",
        ar: "ar", "ar-sa": "ar", "ar-ae": "ar", "ar-eg": "ar", "ar-ma": "ar",
        nl: "nl", "nl-nl": "nl", "nl-be": "nl",
        da: "da", "da-dk": "da",
        fi: "fi", "fi-fi": "fi",
        no: "no", nb: "no", nn: "no",
        pl: "pl", "pl-pl": "pl",
        ru: "ru", "ru-ru": "ru",
        sv: "sv", "sv-se": "sv",
        tr: "tr", "tr-tr": "tr",
        hi: "hi", "hi-in": "hi",
      };
      var saved = localStorage.getItem("lang");
      if (saved && langMap[saved]) {
        window.location.replace(saved + "/");
        return;
      }
      var browserLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      var lang = langMap[browserLang] || langMap[browserLang.split("-")[0]] || "en";
      localStorage.setItem("lang", lang);
      window.location.replace(lang + "/");
    })();
  </script>
